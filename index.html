<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ניהול כספים אישי</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app-shell">
    <nav id="main-nav">
      <div class="nav-brand">
        <svg class="nav-logo" viewBox="0 0 24 24" width="30" height="30">
          <circle cx="12" cy="12" r="12" fill="url(#navLogoGrad)"/>
          <path d="M6 14.5l3.5-4 3 3 5-6.5" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <defs>
            <linearGradient id="navLogoGrad" x1="0" y1="0" x2="24" y2="24">
              <stop stop-color="#ed9e59"/>
              <stop offset="1" stop-color="#a34054"/>
            </linearGradient>
          </defs>
        </svg>
        <span class="nav-title">ניהול כספים</span>
      </div>
      <div class="nav-links">
        <button data-route="dashboard" class="active">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9h12v-9"/></svg>
          <span>דשבורד</span>
        </button>
        <button data-route="transactions">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h13l-3-3"/><path d="M20 17H7l3 3"/></svg>
          <span>תנועות</span>
        </button>
        <button data-route="accounts">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><circle cx="16" cy="14.2" r="1.1" fill="currentColor" stroke="none"/></svg>
          <span>חשבונות</span>
        </button>
        <button data-route="import">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"/><path d="M8 8l4-4 4 4"/><path d="M4 15v4h16v-4"/></svg>
          <span>ייבוא קבצים</span>
        </button>
        <button data-route="simulate">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l5-5 4 4 7-8"/><path d="M15 8h5v5"/></svg>
          <span>סימולציה</span>
        </button>
        <button data-route="settings">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10"/><circle cx="17" cy="7" r="2"/><path d="M20 14H10"/><circle cx="7" cy="14" r="2"/></svg>
          <span>הגדרות</span>
        </button>
      </div>
    </nav>
    <main id="view"></main>
  </div>
  <div id="toast"></div>

  <script src="vendor/chart.umd.min.js"></script>
  <script src="vendor/xlsx.full.min.js"></script>

  <script src="js/state.js"></script>
  <script src="js/accounts.js"></script>
  <script src="js/loans.js"></script>
  <script src="js/categories.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/transactions.js"></script>
  <script src="js/store.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/simulate.js"></script>

  <script src="js/import/parse-xlsx.js"></script>
  <script src="js/import/profiles.js"></script>
  <script src="js/import/dedupe.js"></script>

  <script src="js/ui/common.js"></script>
  <script src="js/ui/view-dashboard.js"></script>
  <script src="js/ui/view-transactions.js"></script>
  <script src="js/ui/view-accounts.js"></script>
  <script src="js/ui/view-import.js"></script>
  <script src="js/ui/view-simulate.js"></script>
  <script src="js/ui/view-settings.js"></script>
  <script src="js/ui/view-start.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
